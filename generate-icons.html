<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數獨 PWA 圖示生成器</title>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #b2ebf2, #80deea);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            color: #007bff;
            text-align: center;
            margin-bottom: 30px;
        }
        .icon-preview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .icon-item {
            text-align: center;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            background: #f9fafb;
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 10px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
        }
        .icon-large {
            width: 128px;
            height: 128px;
            font-size: 48px;
            border-radius: 24px;
        }
        .instructions {
            background: #e7f3ff;
            border: 1px solid #007bff;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        .instructions h3 {
            color: #0056b3;
            margin-top: 0;
        }
        .instructions ol {
            color: #004085;
        }
        .download-btn {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
            transition: all 0.3s;
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>數獨 PWA 圖示生成器</h1>
        
        <div class="instructions">
            <h3>📋 使用說明</h3>
            <ol>
                <li>在您的電腦上用瀏覽器打開這個 HTML 檔案。</li>
                <li>點擊下方您需要的尺寸按鈕 (192x192 和 512x512)。</li>
                <li>瀏覽器將會自動下載圖示檔案。</li>
                <li>建立一個名為 <code>icons</code> 的資料夾。</li>
                <li>將下載的 <code>icon-192x192.png</code> 和 <code>icon-512x512.png</code> 檔案移動到 <code>icons</code> 資料夾中。</li>
            </ol>
        </div>

        <div class="icon-preview">
            <div class="icon-item">
                <div class="icon">數</div>
                <p>192x192</p>
                <button class="download-btn" onclick="downloadIcon(192)">下載</button>
            </div>
            <div class="icon-item">
                <div class="icon">數</div>
                <p>512x512</p>
                <button class="download-btn" onclick="downloadIcon(512)">下載</button>
            </div>
        </div>
    </div>

    <script>
        function downloadIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#007bff');
            gradient.addColorStop(1, '#0056b3');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            ctx.globalCompositeOperation = 'destination-in';
            ctx.beginPath();
            const radius = size * 0.15;
            // Use a polyfill for roundRect if it doesn't exist
            if (ctx.roundRect) {
                ctx.roundRect(0, 0, size, size, radius);
            } else {
                // Fallback for older browsers
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + width - radius, y);
                ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                ctx.lineTo(x + width, y + height - radius);
                ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                ctx.lineTo(x + radius, y + height);
                ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
            }
            ctx.fill();
            
            ctx.globalCompositeOperation = 'source-over';
            
            ctx.fillStyle = 'white';
            ctx.font = `${size * 0.6}px "Noto Sans TC", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('數', size / 2, size / 2 + size * 0.05); // Adjust position slightly for better centering
            
            const link = document.createElement('a');
            link.download = `icon-${size}x${size}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
