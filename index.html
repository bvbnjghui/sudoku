<!DOCTYPE html>
<html lang="zh-Hant" :lang="currentLang.startsWith('en') ? 'en' : 'zh-Hant'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="一個使用 Alpine.js 和 Tailwind CSS 製作的數獨遊戲 PWA。">

    <title>數獨 PWA</title>
    
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    
    <script defer src="sudoku.js"></script>
    <script defer src="translations.js"></script>
    <script defer src="app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen font-sans py-10">

    <div x-data="sudokuGame()" x-init="loadStats(); checkForUpdates(); setDocTitle(); loadSettings()"
          @keydown.window="handleKeydown($event)"
          class="flex flex-col items-center px-4 w-full" >

        <div x-show="gameState === 'menu'" 
             x-transition 
             class="fixed inset-0 bg-gray-100 flex items-center justify-center p-4 z-40">
           
           <button @click="toggleLang()" 
                   class="absolute top-4 right-4 py-2 px-4 rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300 transition" 
                   x-text="t('langToggle')">
           </button>

           <div class="text-center">
                <h1 class="text-5xl font-bold text-gray-800 mb-10" x-text="t('mainTitle')"></h1>
                <h2 class="text-2xl font-semibold text-gray-700 mb-6" x-text="t('menuTitle')"></h2>
                
                <div class="grid grid-cols-1 gap-4 w-64 mx-auto">
                    <button @click="startGame('easy')" class="py-3 px-6 rounded-lg font-semibold text-lg bg-blue-500 text-white shadow-md hover:bg-blue-600 transition" x-text="t('diffEasy')"></button>
                    <button @click="startGame('medium')" class="py-3 px-6 rounded-lg font-semibold text-lg bg-blue-600 text-white shadow-md hover:bg-blue-700 transition" x-text="t('diffMedium')"></button>
                    <button @click="startGame('hard')" class="py-3 px-6 rounded-lg font-semibold text-lg bg-blue-700 text-white shadow-md hover:bg-blue-800 transition" x-text="t('diffHard')"></button>
                    <button @click="startGame('very-hard')" class="py-3 px-6 rounded-lg font-semibold text-lg bg-gray-600 text-white shadow-md hover:bg-gray-700 transition" x-text="t('diffVeryHard')"></button>
                    <button @click="startGame('insane')" class="py-3 px-6 rounded-lg font-semibold text-lg bg-gray-800 text-white shadow-md hover:bg-black transition" x-text="t('diffInsane')"></button>
                    
                    <button @click="toggleStats(true)" class="py-3 px-6 rounded-lg font-semibold text-lg bg-purple-600 text-white shadow-md hover:bg-purple-700 transition mt-8" x-text="t('statsButton')"></button>
                    
                    <button @click="toggleSettings(true)" class="py-3 px-6 rounded-lg font-semibold text-lg bg-gray-500 text-white shadow-md hover:bg-gray-600 transition" x-text="t('settingsButton')"></button>
                </div>
            </div>
        </div>

        <div x-show="gameState === 'paused'"
             x-transition
             class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-40"
             @click.self="resumeGame()">
            <div class="text-center">
                <h2 class="text-5xl font-bold text-white mb-8" x-text="t('pausedTitle')"></h2>
                <button @click="resumeGame()" class="py-3 px-10 rounded-lg font-semibold text-2xl bg-white text-blue-600 shadow-md hover:bg-gray-100 transition" x-text="t('resumeButton')"></button>
            </div>
        </div>

        <div x-show="showHintConfirm"
             x-transition
             class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-40"
             @click.self="cancelUseHint()">
            <div class="text-center">
                <h2 class="text-3xl font-bold text-white mb-6" x-text="t('hintConfirmTitle')"></h2>
                <div class="flex gap-4 justify-center">
                    <button @click="confirmUseHint()" class="py-2 px-6 rounded-lg font-semibold text-lg bg-green-600 text-white shadow-md hover:bg-green-700 transition" x-text="t('confirmButton')"></button>
                    <button @click="cancelUseHint()" class="py-2 px-6 rounded-lg font-semibold text-lg bg-gray-600 text-white shadow-md hover:bg-gray-700 transition" x-text="t('cancelButton')"></button>
                </div>
            </div>
        </div>
        
        <div x-show="gameState === 'gameOver'"
             x-transition
             class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-40">
             <div class="bg-white rounded-lg shadow-xl p-8 text-center">
                <h2 class="text-3xl font-bold text-red-600 mb-4" x-text="t('gameOverTitle')"></h2>
                <p class="text-lg text-gray-700 mb-6" x-text="message"></p>
                <div class="flex gap-4 justify-center">
                    <button @click="restartGame()" class="py-2 px-6 rounded-lg font-semibold text-lg bg-green-600 text-white shadow-md hover:bg-green-700 transition" x-text="t('restartGameButton')"></button>
                    <button @click="onNewGameClick()" class="py-2 px-6 rounded-lg font-semibold text-lg bg-blue-600 text-white shadow-md hover:bg-blue-700 transition" x-text="t('newGameButton')"></button>
                </div>
            </div>
        </div>


        <div x-show="gameState !== 'menu'" class="flex flex-col items-center w-full max-w-lg">
            <h1 class="text-4xl font-bold text-gray-800 mb-4" x-text="t('mainTitle')"></h1>

            <div class="flex justify-between items-center w-full mb-4 text-lg">
                <div class="flex">
                    <span x-text="t('errorLabel')"></span>
                    <span x-text="errorCount" class="font-bold text-red-600 w-8 text-left ml-1"></span>
                    <span> / </span>
                    <span x-text="maxErrors >= 999 ? '∞' : maxErrors" class="ml-1"></span>
                </div>
                <button @click="pauseGame()" :title="t('pauseButtonHint')" class="py-2 px-4 rounded-lg font-semibold bg-white text-gray-700 shadow-md hover:bg-gray-50">
                    <span x-text="t('pauseButton')"></span><span class="hidden sm:inline"> (P) </span>
                </button>
                <div class="flex">
                    <span x-text="t('timeLabel')"></span>
                    <span x-text="formatTime(timer)" class="font-bold text-blue-600 w-16 text-right ml-2"></span>
                </div>
            </div>
            
            <script>
              if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                  navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                      console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(error => {
                      console.log('ServiceWorker registration failed: ', error);
                    });
                });
              }
            </script>

            <div class="grid grid-cols-9
                       border-2 border-gray-800
                       shadow-lg w-full aspect-square" :class="{ 'opacity-50 blur-sm pointer-events-none': gameState === 'paused' || gameState === 'gameOver' || showHintConfirm }"
                 @click.away="selectedCell = null; clearHighlights()"
            >
                <template x-for="(row, rowIndex) in board" :key="rowIndex">
                    <template x-for="(cell, colIndex) in row" :key="colIndex">
                        <div class="
                                    flex items-center justify-center
                                    border-r border-b border-gray-300
                                    relative cursor-pointer transition-colors duration-150 aspect-square" :class="{
                                 'border-r-2 border-gray-800': colIndex === 2 || colIndex === 5,
                                 'border-b-2 border-gray-800': rowIndex === 3 || rowIndex === 6,
                                 'bg-blue-100': isSelected(rowIndex, colIndex),
                                 'bg-blue-200': isHighlightedNumber(rowIndex, colIndex) && !isSelected(rowIndex, colIndex),
                                 'bg-blue-50': isRelated(rowIndex, colIndex) && !isSelected(rowIndex, colIndex) && !isHighlightedNumber(rowIndex, colIndex),
                                 'bg-white': !isSelected(rowIndex, colIndex) && !isRelated(rowIndex, colIndex) && !isHighlightedNumber(rowIndex, colIndex),
                                 'ring-2 ring-blue-600 ring-inset z-10': isSelected(rowIndex, colIndex),
                                 'cursor-default': cell.isGiven || cell.isLocked,
                             }"
                             @click="handleCellClick(rowIndex, colIndex)"
                             :data-row="rowIndex"
                             :data-col="colIndex"
                             tabindex="-1"
                        >
                            <template x-if="cell.value !== 0">
                                <span class="text-xl sm:text-2xl font-bold"
                                      :class="{
                                          'text-gray-700': cell.isGiven,                        
                                          'text-red-600': !cell.isGiven && cell.isError,   
                                          'text-blue-700': !cell.isGiven && !cell.isError, 
                                      }"
                                      x-text="cell.value">
                                </span>
                            </template>

                            <template x-if="cell.value === 0 && !cell.isGiven">
                                <div class="note-grid text-[8px] sm:text-[10px]">
                                    <template x-for="n in 9" :key="n">
                                        <div class="note-cell"
                                             :class="{ 
                                                 'bg-blue-200 rounded-sm': isNoteHighlighted(n) && cell.notes[n-1] 
                                             }">
                                            <span x-show="cell.notes[n-1]" x-text="n"></span>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            </div>
                    </template>
                </template>
            </div>
            
            <div class="flex gap-2 mt-6">
                <button @click="handleNumberInput(0)" :title="t('deleteButtonHint')" class="py-2 px-4 rounded-lg font-semibold bg-white text-red-500 shadow-md hover:bg-red-50" x-text="t('deleteButton')"></button>
                <button @click="useHint()" :title="t('hintButton')" class="py-2 px-4 rounded-lg font-semibold" :class="getRemainingHints() > 0 ? 'bg-yellow-500 text-white shadow-md hover:bg-yellow-600' : 'bg-gray-400 text-gray-600 cursor-not-allowed'">
                    <span x-text="t('hintButton')"></span> (<span x-text="getRemainingHints()"></span>)
                </button>
                <button @click="isNoteMode = false; remainSelected()" :title="t('numberButtonHint')" class="py-2 px-4 rounded-lg font-semibold" :class="!isNoteMode ? 'bg-blue-600 text-white shadow-md' : 'bg-gray-200 text-gray-700'">
                    <span x-text="t('numberButton')"></span><span class="hidden sm:inline"> (N) </span>
                </button>
                <button @click="isNoteMode = true; remainSelected()" :title="t('noteButtonHint')" class="py-2 px-4 rounded-lg font-semibold" :class="isNoteMode ? 'bg-blue-600 text-white shadow-md' : 'bg-gray-200 text-gray-700'">
                    <span x-text="t('noteButton')"></span><span class="hidden sm:inline"> (N) </span>
                </button>
            </div>

            <div class="flex flex-row flex-wrap justify-center gap-2 mt-4">
                 <template x-for="n in 9" :key="n"> 
                    <button @click="handleNumberInput(n)" 
                            class="w-10 h-10 sm:w-12 sm:h-12 bg-white rounded-lg shadow hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-400"
                            :class="{ 
                                'text-gray-300': remainingCounts[n] === 0, 
                                'text-blue-600': remainingCounts[n] > 0 
                            }">
                        <div class="flex flex-col items-center justify-center -mt-1">
                            <span class="text-xl sm:text-2xl font-bold" x-text="n"></span>
                            <span x-show="remainingCounts[n] > 0"
                                  x-text="remainingCounts[n]"
                                  class="text-[10px] sm:text-xs font-medium text-gray-400 -mt-1">
                            </span>
                            <span x-show="remainingCounts[n] === 0"
                                  class="text-[10px] sm:text-xs font-medium text-transparent -mt-1">
                                0
                            </span>
                        </div>
                    </button>
                </template> 
            </div>


            <div class="flex flex-wrap justify-center gap-4 mt-6">
                <button @click="toggleStats(true)" class="py-2 px-5 bg-purple-600 text-white font-semibold rounded-lg shadow-md hover:bg-purple-700 transition" x-text="t('statsButton')"></button>
                <button @click="restartGame()" class="py-2 px-5 bg-orange-500 text-white font-semibold rounded-lg shadow-md hover:bg-orange-600 transition" x-text="t('restartGameButton')"></button>
                <button @click="onNewGameClick()" class="py-2 px-5 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 transition" x-text="t('newGameButton')"></button>
                </div>

            <div class="h-8 mt-4"> <p class="text-xl font-bold" x-text="message" :class="messageClass"></p> </div>

        </div>
        
        <div x-show="showStats" 
             x-transition
             class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50"
             @click.self="toggleStats(false)" 
        >
             <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-2xl max-h-[90vh] flex flex-col">
                <div class="flex justify-between items-center border-b pb-3 mb-4 flex-shrink-0">
                    <h2 class="text-2xl font-bold" x-text="t('statsTitle')"></h2>
                    <button @click="toggleStats(false)" class="text-2xl font-bold text-gray-500 hover:text-gray-800">&times;</button>
                </div>
                <div class="overflow-y-auto">
                    <div class="grid grid-cols-2 gap-4 text-center mb-4">
                        <div class="bg-gray-100 p-3 rounded-lg">
                            <div class="text-sm text-gray-600" x-text="t('statsCurrentStreak')"></div>
                            <div class="text-3xl font-bold" x-text="stats.currentStreak"></div>
                        </div>
                        <div class="bg-gray-100 p-3 rounded-lg">
                            <div class="text-sm text-gray-600" x-text="t('statsBestStreak')"></div>
                            <div class="text-3xl font-bold" x-text="stats.bestStreak"></div>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="bg-gray-50">
                                    <th class="p-3 font-semibold text-sm" x-text="t('statsDifficulty')"></th>
                                    <th class="p-3 font-semibold text-sm" x-text="t('statsPlayed')"></th>
                                    <th class="p-3 font-semibold text-sm" x-text="t('statsWon')"></th>
                                    <th class="p-3 font-semibold text-sm" x-text="t('statsWinRate')"></th>
                                    <th class="p-3 font-semibold text-sm" x-text="t('statsBestTime')"></th>
                                    <th class="p-3 font-semibold text-sm" x-text="t('statsAvgTime')"></th>
                                </tr>
                            </thead>
                            <tbody class="divide-y">
                                <template x-for="level in Object.keys(stats.levels)" :key="level">
                                    <tr>
                                        <td class="p-3" x-text="getDifficultyText(level)"></td>
                                        <td class="p-3" x-text="stats.levels[level].played"></td>
                                        <td class="p-3" x-text="stats.levels[level].won"></td>
                                        <td class="p-3" x-text="stats.levels[level].played > 0 ? (stats.levels[level].won / stats.levels[level].played * 100).toFixed(0) + '%' : 'N/A'"></td>
                                        <td class="p-3" x-text="stats.levels[level].bestTime ? formatTime(stats.levels[level].bestTime) : 'N/A'"></td>
                                        <td class="p-3" x-text="stats.levels[level].won > 0 ? formatTime(stats.levels[level].totalTime / stats.levels[level].won) : 'N/A'"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <h3 class="text-xl font-bold mt-6 mb-3" x-text="t('statsRecentGames')"></h3>
                    <div class="overflow-y-auto max-h-60 border rounded-lg">
                        <table class="w-full text-left">
                            <thead class="sticky top-0 bg-gray-100">
                                <tr>
                                    <th class="p-3 font-semibold text-sm" x-text="t('statsDate')"></th>
                                    <th class="p-3 font-semibold text-sm" x-text="t('statsDifficulty')"></th>
                                    <th class="p-3 font-semibold text-sm" x-text="t('statsStatus')"></th>
                                    <th class="p-3 font-semibold text-sm" x-text="t('statsTime')"></th>
                                    <th class="p-3 font-semibold text-sm" x-text="t('statsErrors')"></th>
                                </tr>
                            </thead>
                            <tbody class="divide-y">
                                <template x-if="stats.recentGames.length === 0">
                                    <tr>
                                        <td colspan="5" class="p-4 text-center text-gray-500" x-text="t('statsNoRecord')"></td>
                                    </tr>
                                </template>
                                <template x-for="(game, index) in stats.recentGames" :key="index">
                                    <tr>
                                        <td class="p-3 text-sm" x-text="formatDate(game.date)"></td>
                                        <td class="p-3" x-text="getDifficultyText(game.difficulty)"></td>
                                        <td class="p-3">
                                            <span x-text="game.status === 'won' ? t('statsStatusWon') : t('statsStatusLost')" 
                                                  :class="game.status === 'won' ? 'text-green-600 font-semibold' : 'text-red-600'">
                                            </span>
                                        </td>
                                        <td class="p-3" x-text="formatTime(game.time)"></td>
                                        <td class="p-3" x-text="game.errors"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <div class="mt-6 pt-4 border-t flex justify-end">
                        <button @click="clearStats()" class="py-2 px-4 rounded-lg font-semibold text-sm bg-red-600 text-white hover:bg-red-700 transition" x-text="t('statsClearButton')"></button>
                    </div>
                </div>
            </div>
        </div>
        
        <div x-show="showSettings"
             x-transition
             class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50"
             @click.self="toggleSettings(false)" 
        >
             <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md flex flex-col gap-6">
                <div class="flex justify-between items-center border-b pb-3">
                    <h2 class="text-2xl font-bold" x-text="t('settingsTitle')"></h2>
                    <button @click="toggleSettings(false)" class="text-2xl font-bold text-gray-500 hover:text-gray-800">&times;</button>
                </div>

                <div class="space-y-6">
                    <div>
                        <label class="block text-lg font-semibold mb-2" x-text="t('settingsMaxErrors')"></label>
                        <div class="flex items-center gap-4">
                            <div class="flex items-center">
                                <button @click="playerMaxErrors = Math.max(1, playerMaxErrors - 1)"
                                        :disabled="playerErrorsUnlimited"
                                        class="w-10 h-10 bg-gray-200 rounded-l font-bold text-xl hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed">-</button>
                                
                                <input type="number" x-model.number="playerMaxErrors"
                                       min="1" max="10"
                                       class="w-16 h-10 p-2 border-t border-b text-center appearance-none [-moz-appearance:textfield]"
                                       :disabled="playerErrorsUnlimited"
                                       :class="{ 'bg-gray-100 text-gray-400': playerErrorsUnlimited }">
                                
                                <button @click="playerMaxErrors = Math.min(10, playerMaxErrors + 1)"
                                        :disabled="playerErrorsUnlimited"
                                        class="w-10 h-10 bg-gray-200 rounded-r font-bold text-xl hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed">+</button>
                            </div>
                            
                            <div class="flex items-center gap-2">
                                <input type="checkbox" id="unlimitedErrors" x-model="playerErrorsUnlimited" class="h-5 w-5">
                                <label for="unlimitedErrors" class="text-gray-700" x-text="t('settingsErrorUnlimited')"></label>
                            </div>
                        </div>
                    </div>
                    
                    <div>
                        <label for="maxHintsInput" class="block text-lg font-semibold" x-text="t('settingsMaxHints')"></label>
                        <p class="text-xs text-gray-500 mb-2" x-text="t('settingsHintsInfo')"></p>
                        <div class="flex items-center">
                            <button @click="playerMaxHints = Math.max(0, playerMaxHints - 1)"
                                    class="w-10 h-10 bg-gray-200 rounded-l font-bold text-xl hover:bg-gray-300">-</button>
                            
                            <input type="number" id="maxHintsInput" x-model.number="playerMaxHints"
                                   min="0" max="99"
                                   class="w-16 h-10 p-2 border-t border-b text-center appearance-none [-moz-appearance:textfield]">
                            
                            <button @click="playerMaxHints = Math.min(99, playerMaxHints + 1)"
                                    class="w-10 h-10 bg-gray-200 rounded-r font-bold text-xl hover:bg-gray-300">+</button>
                        </div>
                    </div>
                </div>

                <div class="mt-4 pt-4 border-t flex justify-end">
                    <button @click="saveSettings()" 
                            class="py-2 px-6 rounded-lg font-semibold text-lg bg-blue-600 text-white shadow-md hover:bg-blue-700 transition"
                            x-text="t('saveButton')">
                    </button>
                </div>
             </div>
        </div>
        <footer class="text-center text-gray-500 text-sm mt-8">
            <span x-text="t('versionLabel')"></span> <span x-text="version"></span>
            <div x-show="updateAvailable" class="mt-2">
                <button @click="updatePWA()" class="bg-blue-500 text-white px-3 py-1 rounded text-xs hover:bg-blue-600 transition" x-text="t('updateAvailable')">
                </button>
            </div>
        </footer>

    </div>
</body>
</html>
